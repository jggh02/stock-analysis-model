[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockengine"
version = "0.1.0"
description = "Portfolio risk analysis, weight optimisation, return forecasting, and backtesting for Indian NSE equities"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
]

[project.scripts]
stockengine = "stockengine.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stockengine"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
